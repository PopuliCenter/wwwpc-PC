apply plugin: 'com.android.application'

// Kredensial penandatanganan rilis dibaca dari keystore.properties (root modul
// android/, DI-GITIGNORE). Bila tidak ada (mis. mesin lain / CI tanpa key),
// build release jatuh ke debug-signing agar tidak gagal — JANGAN unggah AAB
// seperti itu ke Play. Lihat android/keystore.properties.example.
def keystorePropsFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// ── Versi (MANUAL) ───────────────────────────────────────────────────────────
// Ubah DI SINI tiap rilis. Dua angka, beda fungsi:
//   appVersionName : versi yang DILIHAT pengguna (Play, "Tentang aplikasi").
//                    Naikkan untuk rilis bermakna — 1.0.0 → 1.0.1 (perbaikan)
//                    atau 1.1.0 (fitur baru).
//   appVersionCode : angka internal, TIDAK dilihat pengguna. WAJIB dinaikkan
//                    +1 SETIAP upload ke Play (1 → 2 → 3 …); Play menolak bila
//                    ≤ upload sebelumnya. Nilai boleh berapa saja asal naik.
// Nama file output otomatis memuat keduanya:
//   riset-populi-center-v<appVersionName>-code<appVersionCode>-release.{aab,apk}
def appVersionName = "1.0.0"
def appVersionCode = 1

android {
    namespace = "com.populicenter.survei"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.populicenter.survei"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Pakai key rilis bila tersedia; jika tidak, biarkan default (debug).
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            // R8: minify + obfuscate shell native. Logika app ada di bundle JS
            // (sudah diminify Vite). Bila build rilis bermasalah, set false &
            // uji ulang. Aturan keep ada di proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Nama output artifact memuat versi + code agar mudah dibedakan & diarsipkan
// (juga tak bentrok dengan aplikasi lain). Contoh:
//   riset-populi-center-v1.0.0-code1-release.apk / .aab
base {
    archivesName = "riset-populi-center-v${appVersionName}-code${appVersionCode}"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
