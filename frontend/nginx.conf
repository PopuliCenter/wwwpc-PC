server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Health check (Docker / load balancer probe) ──────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API Proxy → NestJS backend ───────────────────────────────────────────
    # Backend memakai global prefix 'api' (main.ts → setGlobalPrefix('api')),
    # jadi semua rute ada di /api/*. JANGAN strip /api: teruskan path apa adanya
    # (proxy_pass TANPA trailing slash) agar /api/auth/login cocok di backend.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for WebSocket / SSE if used in the future
        proxy_set_header   Connection        "";

        # Disable buffering for streaming responses (export downloads, SSE)
        proxy_buffering    off;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Larger body for file uploads (must match UPLOAD_MAX_BYTES in backend)
        client_max_body_size 10m;
    }

    # ── MinIO presigned-URL proxy (opsional, untuk download ekspor) ───────────
    # Hanya aktifkan jika MinIO tidak punya public URL sendiri.
    # location /storage/ {
    #     proxy_pass http://minio:9000/;
    #     proxy_set_header Host minio:9000;
    # }

    # ── Static assets — cache 1 tahun, immutable ────────────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — semua route lain → index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Jangan cache index.html agar versi baru langsung tampil
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
