server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Health check (Docker / load balancer probe) ──────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API Proxy → NestJS backend ───────────────────────────────────────────
    # Backend memakai global prefix 'api' (main.ts → setGlobalPrefix('api')),
    # jadi semua rute ada di /api/*. JANGAN strip /api: teruskan path apa adanya
    # (proxy_pass TANPA trailing slash) agar /api/auth/login cocok di backend.
    location /api/ {
        # Resolve nama service "backend" secara DINAMIS via DNS internal Docker
        # (127.0.0.11), bukan sekali saat nginx start. Dua manfaat:
        #  1) Multi-replika: Docker round-robin ke semua replika backend.
        #  2) Deploy image / restart backend: IP baru langsung terpakai tanpa
        #     perlu reload nginx (tanpa ini, upstream statis = 502 sampai reload).
        # proxy_pass dgn variabel WAJIB menyertakan URI eksplisit → pakai
        # $request_uri agar path+query diteruskan apa adanya (tidak strip /api).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass         http://$backend_upstream:3000$request_uri;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for WebSocket / SSE if used in the future
        proxy_set_header   Connection        "";

        # Disable buffering for streaming responses (export downloads, SSE)
        proxy_buffering    off;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Larger body for file uploads (must match UPLOAD_MAX_BYTES in backend)
        client_max_body_size 10m;
    }

    # ── MinIO presigned-URL proxy (opsional, untuk download ekspor) ───────────
    # Hanya aktifkan jika MinIO tidak punya public URL sendiri.
    # location /storage/ {
    #     proxy_pass http://minio:9000/;
    #     proxy_set_header Host minio:9000;
    # }

    # ── Service worker & manifest — JANGAN cache ────────────────────────────
    # Nama file-nya stabil (sw.js, registerSW.js, manifest), jadi kalau ikut
    # di-cache 1 tahun seperti aset lain, update tidak akan terdeteksi dan
    # pengguna terjebak versi lama. Exact-match (=) menang atas regex di bawah.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ── Static assets — cache 1 tahun, immutable ────────────────────────────
    # Aman karena nama file ber-hash (berubah tiap build).
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — semua route lain → index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Jangan cache index.html agar versi baru langsung tampil.
        # CDN-Cache-Control khusus mencegah Cloudflare/CDN menyimpan HTML di edge
        # (mengatasi gejala "refresh biasa = versi lama").
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
