server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Jangan bocorkan versi nginx di header Server & halaman error (audit T-24).
    server_tokens off;
    # Redirect internal (mis. /api → /api/) memakai Location RELATIF. Tanpa ini
    # nginx menulis "http://<host>/api/" karena di belakang Cloudflare/edge ia
    # hanya melihat HTTP → redirect turun ke http (audit T-24).
    absolute_redirect off;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Health check (Docker / load balancer probe) ──────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API Proxy → NestJS backend ───────────────────────────────────────────
    # Backend memakai global prefix 'api' (main.ts → setGlobalPrefix('api')),
    # jadi semua rute ada di /api/*. JANGAN strip /api: teruskan path apa adanya
    # (proxy_pass TANPA trailing slash) agar /api/auth/login cocok di backend.
    location /api/ {
        # Resolve nama service "backend" secara DINAMIS via DNS internal Docker
        # (127.0.0.11), bukan sekali saat nginx start. Dua manfaat:
        #  1) Multi-replika: Docker round-robin ke semua replika backend.
        #  2) Deploy image / restart backend: IP baru langsung terpakai tanpa
        #     perlu reload nginx (tanpa ini, upstream statis = 502 sampai reload).
        # proxy_pass dgn variabel WAJIB menyertakan URI eksplisit → pakai
        # $request_uri agar path+query diteruskan apa adanya (tidak strip /api).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass         http://$backend_upstream:3000$request_uri;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for WebSocket / SSE if used in the future
        proxy_set_header   Connection        "";

        # Disable buffering for streaming responses (export downloads, SSE)
        proxy_buffering    off;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Larger body for file uploads (must match UPLOAD_MAX_BYTES in backend)
        client_max_body_size 10m;
    }

    # ── MinIO presigned-URL proxy (opsional, untuk download ekspor) ───────────
    # Hanya aktifkan jika MinIO tidak punya public URL sendiri.
    # location /storage/ {
    #     proxy_pass http://minio:9000/;
    #     proxy_set_header Host minio:9000;
    # }

    # ── Service worker & manifest — JANGAN cache ────────────────────────────
    # Nama file-nya stabil (sw.js, registerSW.js, manifest), jadi kalau ikut
    # di-cache 1 tahun seperti aset lain, update tidak akan terdeteksi dan
    # pengguna terjebak versi lama. Exact-match (=) menang atas regex di bawah.
    # CATATAN nginx: `add_header` TIDAK diwarisi ke sebuah location bila location
    # itu punya `add_header` sendiri. Karena hampir semua location di bawah
    # memasang Cache-Control, header keamanan HARUS diulang di tiap location yang
    # menyajikan konten ke browser — kalau ditaruh sekali di level server, ia
    # justru terbuang di semua location itu (dokumen utama jadi tanpa proteksi).
    #
    # HSTS (audit T-15): PER-HOST, TANPA includeSubDomains/preload — populicenter.com
    # dipakai bersama app lain di subdomain, dan HSTS per-host tidak memengaruhi
    # subdomain lain. Browser mengabaikan HSTS yang diterima lewat http, jadi
    # aman dikirim dari origin di belakang Cloudflare. JANGAN tambahkan
    # `return 301 https://` berbasis $scheme di sini: selama SSL mode Cloudflare
    # mungkin Flexible, itu memicu loop. Redirect http→https dipasang di
    # Cloudflare (Redirect Rule per-host). /api/ sengaja TIDAK diberi header di
    # sini: helmet backend sudah mengirim HSTS untuk /api.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Dimuat sw.js lewat importScripts (hapus cache /api lama saat activate).
    # Nama stabil → jangan ikut cache 1 tahun di bawah.
    location = /sw-cleanup.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Static assets — cache 1 tahun, immutable ────────────────────────────
    # Aman karena nama file ber-hash (berubah tiap build).
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── SPA fallback — semua route lain → index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Jangan cache index.html agar versi baru langsung tampil.
        # CDN-Cache-Control khusus mencegah Cloudflare/CDN menyimpan HTML di edge
        # (mengatasi gejala "refresh biasa = versi lama").
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;

        # Header keamanan pada DOKUMEN utama (HTML). Diulang di sini karena
        # location ini punya add_header sendiri (lihat catatan di atas).
        # - X-Frame-Options: cegah clickjacking (halaman di-iframe situs lain)
        # - nosniff: cegah MIME-sniffing
        # - Referrer-Policy: batasi kebocoran URL saat navigasi keluar
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        # HSTS per-host (lihat catatan di atas location = /sw.js).
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Fitur peramban: kamera (foto), mikrofon (rekam audio), dan GPS dipakai
        # aplikasi ini sendiri; selebihnya dimatikan. (audit T-23)
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()" always;

        # CSP masih REPORT-ONLY (audit T-23): pelanggaran hanya dicatat di console
        # peramban, tidak memblokir. Pantau dulu, baru ganti nama header menjadi
        # Content-Security-Policy. Sumber eksternal:
        #  - accounts.google.com/gsi/*  : tombol "Masuk dengan Google" (GIS)
        #  - nominatim.openstreetmap.org: reverse-geocoding (useGeolocation.ts)
        #  - img https:                 : avatar Google/DiceBear, ubin peta OSM
        # Firebase (FCM) hanya dipakai aplikasi native, tidak dimuat di web. API
        # web = '/api' relatif → 'self'.
        # Hash sha256 = skrip tema inline di index.html. WAJIB dihitung ulang bila
        # isi skrip itu berubah (lihat laporan audit/README ops).
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-EAyxVSC4mz20HCP/Bx8kOo3PW2lCgGyXUgMnRht4bGI=' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/ https://nominatim.openstreetmap.org; frame-src https://accounts.google.com/gsi/; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
}
