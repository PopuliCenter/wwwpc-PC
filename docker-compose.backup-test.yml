# Infrastruktur EPHEMERAL untuk UJI backup↔restore (lokal/CI).
# Postgres (tmpfs) + MinIO (volume) — sekali pakai.
#   docker compose -f docker-compose.backup-test.yml up -d
#   bash scripts/test-backup-restore.sh
#   docker compose -f docker-compose.backup-test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: survei_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d survei_test']
      interval: 3s
      timeout: 3s
      retries: 20

  # Penampung volume /data — BUKAN server MinIO sungguhan. Uji backup↔restore
  # tidak pernah memakai API MinIO: backup.sh/restore.sh hanya men-tar/untar
  # volume lewat `docker run --volumes-from <minio> alpine`. Dulu memakai image
  # MinIO, tapi proyek MinIO komunitas sudah di-archive (2026) dan image-nya
  # tak lagi bisa ditarik dari Docker Hub maupun quay.io (401) — membuat job
  # gagal tanpa ada kaitan dengan logika backup. Nama service tetap `minio`
  # karena dirujuk skrip (compose ps -q minio → MINIO_CONTAINER).
  minio:
    image: alpine:3
    command: ['sleep', 'infinity']
    volumes:
      - minio_backup_test:/data

volumes:
  minio_backup_test:
