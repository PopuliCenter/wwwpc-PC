# Infrastruktur EPHEMERAL untuk UJI backup↔restore (lokal/CI).
# Postgres (tmpfs) + MinIO (volume) — sekali pakai.
#   docker compose -f docker-compose.backup-test.yml up -d
#   bash scripts/test-backup-restore.sh
#   docker compose -f docker-compose.backup-test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: survei_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d survei_test']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # MinIO memindahkan distribusi resmi ke quay.io; image Docker Hub (minio/minio)
    # tidak lagi bisa di-pull (401) — inilah penyebab job backup-restore gagal.
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_backup_test:/data

volumes:
  minio_backup_test:
