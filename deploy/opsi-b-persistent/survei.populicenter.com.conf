# =============================================================================
# Server block PERSISTEN: survei.populicenter.com  →  app survei (survei_frontend)
# =============================================================================
# Domain UTAMA aplikasi survei (migrasi dari survei.risetcenter.com, 2026-07).
# Vhost lama survei.risetcenter.com kini hanya 301 redirect ke sini
# (lihat survei.risetcenter.com.conf).
#
# Cara pakai (lihat README.md di folder ini):
#   - Di-include oleh nginx app lama (mount ke /etc/nginx/conf.d/ via override),
#     ATAU disalin permanen ke conf.d nginx app lama.
#
# PENTING — SERTIFIKAT BARU:
#   Cert lama /etc/nginx/certs/origin.pem hanya SAN *.risetcenter.com — TIDAK
#   menutup populicenter.com. Buat **Cloudflare Origin Certificate baru** untuk
#   zona populicenter.com (SAN populicenter.com + *.populicenter.com) di
#   dashboard Cloudflare → SSL/TLS → Origin Server → Create Certificate, lalu
#   simpan di VPS sebagai:
#     /etc/nginx/certs/populicenter-origin.pem   (isi CERTIFICATE)
#     /etc/nginx/certs/populicenter-origin.key   (isi PRIVATE KEY)
#
# PENTING — PORT 80 WAJIB ADA:
#   Bila zona populicenter.com pakai SSL mode **Flexible**, Cloudflare menghubungi
#   origin lewat **HTTP port 80**. Tanpa `listen 80;`, request jatuh ke catch-all
#   app lama (server_name _) → pengunjung melihat APP LAMA. server_name eksakt
#   `survei.populicenter.com` menang atas catch-all `_`.
#   Rekomendasi: set SSL mode populicenter.com ke **Full** agar CF↔origin lewat
#   443 (cert di atas dipakai). Block 80 tetap disertakan sebagai jaring pengaman.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name survei.populicenter.com;

    # --- SSL: Cloudflare Origin Certificate BARU untuk populicenter.com ---
    ssl_certificate     /etc/nginx/certs/populicenter-origin.pem;
    ssl_certificate_key /etc/nginx/certs/populicenter-origin.key;

    # Izinkan unggah media (foto/audio/tanda tangan/berkas). ≥ batas backend (5 MB).
    client_max_body_size 12m;

    # Resolver Docker + variabel: nginx tidak gagal start bila survei_frontend
    # sementara tidak ada (mis. saat stack survei sedang rebuild).
    resolver 127.0.0.11 valid=30s;
    set $survei_upstream survei_frontend;

    location / {
        proxy_pass http://$survei_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
