# =============================================================================
# Server block PERSISTEN: survei.risetcenter.com  →  app survei (survei_frontend)
# =============================================================================
# Tujuan: routing ke aplikasi survei TIDAK lagi hilang saat app lama redeploy.
#
# Cara pakai (lihat README.md di folder ini):
#   - Di-include oleh nginx app lama (mount ke /etc/nginx/conf.d/ via override),
#     ATAU disalin permanen ke conf.d nginx app lama.
#
# PENTING — PORT 80 WAJIB ADA:
#   Cloudflare zona risetcenter.com memakai SSL mode **Flexible**, jadi Cloudflare
#   menghubungi origin lewat **HTTP port 80** (bukan 443). Tanpa `listen 80;`,
#   request survei jatuh ke block catch-all app lama (server_name _) di port 80
#   → pengunjung melihat APP LAMA walau block 443 sudah benar. server_name eksakt
#   `survei.risetcenter.com` menang atas catch-all `_` app lama di port 80.
#
# Catatan:
#   - Block 443 tetap ada agar tetap benar bila nanti pindah ke SSL mode Full.
#   - Sertifikat memakai Cloudflare Origin Certificate yang SAMA dengan app lama
#     (SAN *.risetcenter.com). SESUAIKAN path cert/key di bawah agar identik
#     dengan yang dipakai server block risetcenter.com app lama.
#   - "resolver 127.0.0.11" + variabel upstream → nginx tetap START walau
#     container survei sedang turun (tidak gagal total seperti upstream statis).
# =============================================================================

server {
    # Port 80 untuk Cloudflare Flexible (HTTP ke origin) + 443 untuk Full/langsung.
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name survei.risetcenter.com;

    # --- SSL: samakan dengan path cert/key app lama (Cloudflare Origin) ---
    # (hanya berlaku untuk listener 443; listener 80 melayani HTTP polos)
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Izinkan unggah media (foto/audio/tanda tangan/berkas). ≥ batas backend (5 MB).
    client_max_body_size 12m;

    # Resolver Docker + variabel: nginx tidak gagal start bila survei_frontend
    # sementara tidak ada (mis. saat stack survei sedang rebuild).
    resolver 127.0.0.11 valid=30s;
    set $survei_upstream survei_frontend;

    location / {
        proxy_pass http://$survei_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
