# =============================================================================
# Server block: survei.risetcenter.com  →  301 REDIRECT ke survei.populicenter.com
# =============================================================================
# Sejak migrasi domain (2026-07), aplikasi survei disajikan di
# survei.populicenter.com (lihat survei.populicenter.com.conf). Vhost ini TIDAK
# lagi mem-proxy ke survei_frontend — hanya meneruskan (301) semua permintaan
# lama (link email, QR, bookmark) ke domain baru agar tidak putus.
#
# PENTING — PORT 80 WAJIB ADA:
#   Cloudflare zona risetcenter.com memakai SSL mode **Flexible** (CF ↔ origin via
#   HTTP port 80). Tanpa `listen 80;`, request survei.risetcenter.com jatuh ke
#   catch-all app lama (server_name _) → pengunjung melihat APP LAMA, bukan
#   redirect. server_name eksakt menang atas `_`.
#
# Sertifikat: pakai Cloudflare Origin Certificate LAMA app risetcenter
#   (SAN *.risetcenter.com) — tidak berubah.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name survei.risetcenter.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Redirect permanen ke domain baru, pertahankan path + query string.
    return 301 https://survei.populicenter.com$request_uri;
}
