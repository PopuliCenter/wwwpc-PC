name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Jalankan manual dari tab Actions. Diperlukan saat yang berubah bukan kode
  # melainkan konfigurasi build di GitHub (mis. variable VITE_GOOGLE_CLIENT_ID
  # yang di-bake ke image web) — tanpa ini, satu-satunya cara membangun ulang
  # image adalah membuat commit kosong. Dispatch di main ikut membangun ulang
  # sha-<commit> HEAD main lalu mempromosikannya ke `latest`.
  workflow_dispatch:

# Di luar main (PR, dispatch cabang lain): satu grup per ref, run lama dibatalkan
# saat ada push baru — hanya hasil terbaru yang penting.
# Di main: satu grup PER COMMIT dan tak pernah dibatalkan, karena setiap commit
# main wajib menerbitkan sha-<commit> (bahan rollback). Grup per-ref TIDAK cukup
# walau cancel-in-progress: false — GitHub hanya menyimpan SATU run pending per
# grup (queue default `single`) dan membatalkan pending lama saat run baru masuk.
# (`queue: max` tak bisa dipakai di sini: GitHub melarang menggabungnya dengan
# cancel-in-progress: true yang dipakai untuk PR.) Run main yang berjalan paralel
# tidak berebut `latest`: hanya job promote-latest yang menyentuhnya, berurutan.
# Izin GITHUB_TOKEN minimum untuk SEMUA job (T-36). Job yang menerbitkan image
# (docker-publish, promote-latest) menaikkan sendiri ke packages: write.
permissions:
  contents: read

# Action pihak ketiga dipin ke SHA commit (tag bisa dipindah pemiliknya);
# komentar `# vX.Y.Z` = tag asal. Naikkan versi: resolve tag baru dengan
# `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>` (pakai
# baris ^{} bila tag beranotasi), lalu ganti SHA + komentar sekaligus.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Semua test backend pakai repository mock (tidak butuh Postgres/Redis/MinIO nyata).
      - name: Typecheck
        run: npx tsc --noEmit -p backend/tsconfig.json
      - name: Test (dengan gate coverage)
        run: npm run test:coverage --workspace=backend
      - name: Build
        run: npm run build --workspace=backend

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Test
        run: npm run test --workspace=frontend
      # `build` = `tsc -b && vite build` — typecheck & build sekaligus, gagal bila ada error tipe.
      - name: Typecheck + Build
        run: npm run build --workspace=frontend

  e2e:
    name: Backend E2E (smoke — DB+Redis nyata)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: survei_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d survei_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Skema DB dibangun lewat migrasi asli (prepareSchema); creds & port
      # service container cocok dgn default di backend/test/e2e-env.ts.
      - name: E2E smoke (login → isi survei → redeem)
        run: npm run test:e2e --workspace=backend

  backup-restore:
    name: Backup ↔ restore (roundtrip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres + MinIO ephemeral
        # Pull dulu dengan retry — penyebab paling umum kegagalan `up -d` di
        # runner adalah rate-limit pull Docker Hub yang bersifat sementara.
        # Retry berjenjang menutup itu; `up -d` lalu memakai image yang sudah ada.
        run: |
          pull_retry() {
            for n in 1 2 3 4 5; do
              docker pull "$1" && return 0
              echo "pull $1 gagal (percobaan $n) — tunggu $((n*10))s"; sleep $((n*10))
            done
            echo "GAGAL pull $1 setelah 5 percobaan"; return 1
          }
          pull_retry postgres:16-alpine
          pull_retry alpine:3.24.4
          docker compose -f docker-compose.backup-test.yml up -d
      - name: Tunggu container sehat
        run: |
          for _ in $(seq 1 30); do
            pg=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose -f docker-compose.backup-test.yml ps -q postgres)" 2>/dev/null || true)
            mi=$(docker inspect --format '{{.State.Running}}' \
              "$(docker compose -f docker-compose.backup-test.yml ps -q minio)" 2>/dev/null || true)
            [ "$pg" = healthy ] && [ "$mi" = true ] && exit 0
            sleep 2
          done
          echo "container tidak siap"; exit 1
      - name: Uji roundtrip backup→restore
        run: bash scripts/test-backup-restore.sh
      - name: Bersihkan
        if: always()
        run: docker compose -f docker-compose.backup-test.yml down -v

  audit:
    name: Security audit (dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # GERBANG WAJIB: gagal bila ada high/critical PRODUKSI DI LUAR allowlist
      # ber-batas-waktu di scripts/audit-gate.mjs (saat ini kosong); tiap entri
      # wajib punya alasan + tanggal kedaluwarsa. Menurunkan --audit-level
      # SENGAJA dihindari (itu membutakan gerbang thd high lain). moderate/low
      # tidak memblokir.
      - name: Audit production deps (gate + allowlist)
        run: node scripts/audit-gate.mjs

  # ── Rilis image (12-factor V: build-release-run terpisah) ────────────────────
  # Build image backend+frontend SEKALI di CI, push ke GHCR. VPS tinggal
  # `docker compose pull` — tidak lagi mem-build di server produksi. Tag:
  #   sha-<commit>    → artefak per commit, diterbitkan job ini — bahan rollback
  #                     (langkah aman: docs/ops/deploy-image-registry.md)
  #   latest          → deploy normal; HANYA dipasang job promote-latest
  # Hanya push/dispatch di main, dan HANYA bila semua job uji hijau — image yang
  # terbit dijamin sudah lolos lint+test+e2e+backup+audit. Kedua image membawa
  # label org.opencontainers.image.revision=<commit> (dibaca promote-latest).
  docker-publish:
    name: Publish image (GHCR)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [lint, backend, frontend, e2e, backup-restore, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Smoke test image backend YANG SEBENARNYA (Alpine/musl + versi Node image)
      # sebelum di-push. Job test lain jalan di Ubuntu/glibc via setup-node, jadi
      # modul native (bcrypt) & runtime image tidak pernah teruji di sana. Kalau
      # gagal di sini, tak ada image yang terbit. Build ini mengisi cache gha yang
      # langsung dipakai ulang oleh langkah push di bawah (label sama → config sama).
      # cache-to ignore-error: run main kini bisa paralel & menulis scope cache
      # yang sama; gagal ekspor cache tak boleh menggagalkan terbitnya image.
      - name: Build backend (lokal, untuk smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          target: runner
          load: true
          tags: survei-backend:smoke
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true
      - name: Smoke test image backend (Node, bcrypt native, nodemailer)
        run: |
          docker run --rm --entrypoint node survei-backend:smoke -e "
            const major = Number(process.versions.node.split('.')[0]);
            if (major < 24) throw new Error('Node ' + process.versions.node + ' < 24');
            const bcrypt = require('bcrypt');
            const h = bcrypt.hashSync('uji-rahasia', 4);
            if (!bcrypt.compareSync('uji-rahasia', h)) throw new Error('bcrypt compare gagal');
            if (bcrypt.compareSync('salah', h)) throw new Error('bcrypt menerima password salah');
            const nm = require('nodemailer');
            if (typeof nm.createTransport !== 'function') throw new Error('nodemailer.createTransport hilang');
            console.log('OK — Node', process.versions.node, '| bcrypt native jalan | nodemailer siap');
          "
      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          target: runner
          push: true
          tags: ghcr.io/populicenter/survei-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true
      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: frontend/Dockerfile
          target: runner
          push: true
          # Samakan dengan build-arg di docker-compose.yml (API relatif /api).
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: ghcr.io/populicenter/survei-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max,ignore-error=true

  # ── Promosi `latest` ─────────────────────────────────────────────────────────
  # Run main berjalan paralel per commit, jadi urutan selesainya acak. Job ini
  # memasang `latest` = sha-<commit> HANYA bila commit ini keturunan (atau sama
  # dengan) revisi yang sedang dipegang `latest` — run commit lama yang selesai
  # belakangan tidak menimpa `latest` dengan versi lama. Label revisi backend
  # DAN frontend dibaca: promosi tak atomik (backend lalu frontend), jadi bila
  # gagal di tengah `latest` bisa terbelah — commit ini harus keturunan
  # keduanya agar tak satu pun mundur.
  # Concurrency job tetap satu grup → promosi berurutan (cek-lalu-tulis tak
  # balapan). Job promote pending yang lama bisa DIBATALKAN GitHub saat job
  # baru masuk antre — tidak berbahaya: job yang lebih baru tetap memasang
  # latest ke commit terbaru (image sha-<commit> sudah terbit di docker-publish).
  promote-latest:
    name: Promosikan latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: docker-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: promote-latest-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promosikan sha-<commit> → latest (bila commit ini yang terbaru)
        env:
          REG: ghcr.io/populicenter
        run: |
          set -euo pipefail
          LABEL=org.opencontainers.image.revision
          BE="$REG/survei-backend"
          FE="$REG/survei-frontend"
          SHA="$GITHUB_SHA"
          short() { printf '%s' "${1:0:12}"; }

          # Jalankan perintah s.d. 3x (jeda 10 s, 20 s): galat registry sesaat.
          retry() {
            local n
            for n in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$n" -lt 3 ]; then sleep $((n * 10)); fi
            done
            return 1
          }

          # rev_latest REPO → REV = label revisi REPO:latest ("" = belum ada /
          # tak berlabel). Keberadaan dicek di level MANIFEST (`--raw` tak
          # menyentuh blob): "belum ada" HANYA bila 3x berturut-turut
          # "<ref>: not found". Galat lain — jaringan, auth, config blob hilang
          # (pesannya juga berakhir "not found") — → job gagal, latest utuh.
          rev_latest() {
            local ref="$1:latest" n out nf=0
            REV=""
            for n in 1 2 3; do
              if out=$(docker buildx imagetools inspect --raw "$ref" 2>&1 >/dev/null); then
                if REV=$(docker buildx imagetools inspect "$ref" --format "{{ index .Image.Config.Labels \"$LABEL\" }}"); then
                  if [ -n "$REV" ] && ! [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "::warning::Label $LABEL di $ref bukan SHA ('$REV') — dianggap kosong."
                    REV=""
                  fi
                  return 0
                fi
                out="gagal membaca label (config image)"
              elif grep -qF -- "$ref: not found" <<<"$out"; then
                nf=$((nf + 1))
              fi
              echo "Baca $ref gagal (percobaan $n): $out"
              if [ "$n" -lt 3 ]; then sleep $((n * 10)); fi
            done
            REV=""
            if [ "$nf" -eq 3 ]; then echo "$ref belum ada"; return 0; fi
            echo "::error::Tidak bisa membaca $ref — latest tidak disentuh."
            exit 1
          }

          # judge NAMA CUR → OK=1 bila latest NAMA boleh dipindah ke commit ini.
          judge() {
            local name=$1 cur=$2 rc=0
            if [ -z "$cur" ]; then
              OK=1; WHY="$name: latest belum ada / belum berlabel revisi (bootstrap)"
              return 0
            fi
            git merge-base --is-ancestor "$cur" "$SHA" 2>/dev/null || rc=$?
            case "$rc" in
              0) OK=1; WHY="$name: latest ($(short "$cur")) leluhur dari / sama dengan commit ini" ;;
              1)
                if git merge-base --is-ancestor "$cur" refs/remotes/origin/main; then
                  OK=0; WHY="$name: latest ($(short "$cur")) lebih baru / bercabang dari commit ini"
                else
                  OK=1; WHY="$name: latest ($(short "$cur")) tidak ada di sejarah main (force-push?)"
                  echo "::warning::Tetap promosikan — $WHY"
                fi
                ;;
              *)
                OK=1; WHY="$name: revisi latest ($(short "$cur")) tak dikenal di repo"
                echo "::warning::Tetap promosikan — $WHY"
                ;;
            esac
          }

          # main terbaru: penentu "ada di sejarah main". Gagal fetch → job gagal,
          # latest tidak tersentuh (lebih aman daripada menebak).
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main

          promote=0
          cur_be="tidak dibaca"
          cur_fe="tidak dibaca"
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            why="commit ini tidak ada (lagi) di sejarah main (force-push?)"
            echo "::warning::Lewati promosi: $why"
          else
            rev_latest "$BE"; cur_be=$REV
            rev_latest "$FE"; cur_fe=$REV
            judge backend "$cur_be"; ok_be=$OK; why_be=$WHY
            judge frontend "$cur_fe"; ok_fe=$OK; why_fe=$WHY
            why="$why_be; $why_fe"
            if [ "$ok_be" = 1 ] && [ "$ok_fe" = 1 ]; then
              promote=1
            else
              echo "::notice::Lewati promosi (run commit yang lebih baru sudah mempromosikan): $why"
            fi
          fi

          if [ "$promote" = 1 ]; then
            retry docker buildx imagetools create -t "$BE:latest" "$BE:sha-$SHA"
            if ! retry docker buildx imagetools create -t "$FE:latest" "$FE:sha-$SHA"; then
              echo "::error::backend:latest sudah = sha-$SHA, frontend:latest BELUM (terbelah). Jangan deploy — Re-run job ini."
              exit 1
            fi
            hasil="DIPROMOSIKAN: \`latest\` → \`sha-$SHA\`"
          else
            hasil="DILEWATI (\`latest\` tetap)"
          fi
          echo "Keputusan: $hasil — $why"
          {
            echo "### Promosi \`latest\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit run ini | \`$SHA\` |"
            echo "| \`latest\` sebelumnya (backend) | \`${cur_be:-kosong / belum ada}\` |"
            echo "| \`latest\` sebelumnya (frontend) | \`${cur_fe:-kosong / belum ada}\` |"
            echo "| Keputusan | $hasil |"
            echo "| Alasan | $why |"
          } >> "$GITHUB_STEP_SUMMARY"
