name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Jalankan manual dari tab Actions. Diperlukan saat yang berubah bukan kode
  # melainkan konfigurasi build di GitHub (mis. variable VITE_GOOGLE_CLIENT_ID
  # yang di-bake ke image web) — tanpa ini, satu-satunya cara membangun ulang
  # image adalah membuat commit kosong.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Semua test backend pakai repository mock (tidak butuh Postgres/Redis/MinIO nyata).
      - name: Typecheck
        run: npx tsc --noEmit -p backend/tsconfig.json
      - name: Test (dengan gate coverage)
        run: npm run test:coverage --workspace=backend
      - name: Build
        run: npm run build --workspace=backend

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Test
        run: npm run test --workspace=frontend
      # `build` = `tsc -b && vite build` — typecheck & build sekaligus, gagal bila ada error tipe.
      - name: Typecheck + Build
        run: npm run build --workspace=frontend

  e2e:
    name: Backend E2E (smoke — DB+Redis nyata)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: survei_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d survei_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Skema DB dibangun lewat migrasi asli (prepareSchema); creds & port
      # service container cocok dgn default di backend/test/e2e-env.ts.
      - name: E2E smoke (login → isi survei → redeem)
        run: npm run test:e2e --workspace=backend

  backup-restore:
    name: Backup ↔ restore (roundtrip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres + MinIO ephemeral
        run: docker compose -f docker-compose.backup-test.yml up -d
      - name: Tunggu container sehat
        run: |
          for i in $(seq 1 30); do
            pg=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose -f docker-compose.backup-test.yml ps -q postgres)" 2>/dev/null || true)
            mi=$(docker inspect --format '{{.State.Running}}' \
              "$(docker compose -f docker-compose.backup-test.yml ps -q minio)" 2>/dev/null || true)
            [ "$pg" = healthy ] && [ "$mi" = true ] && exit 0
            sleep 2
          done
          echo "container tidak siap"; exit 1
      - name: Uji roundtrip backup→restore
        run: bash scripts/test-backup-restore.sh
      - name: Bersihkan
        if: always()
        run: docker compose -f docker-compose.backup-test.yml down -v

  audit:
    name: Security audit (dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # GERBANG WAJIB: gagal bila ada kerentanan PRODUKSI high/critical. Saat ini
      # bersih (0 high/critical) setelah multer di-override & xlsx diganti exceljs.
      # (moderate/low tidak memblokir.)
      - name: Audit production deps (high+)
        run: npm audit --omit=dev --audit-level=high

  # ── Rilis image (12-factor V: build-release-run terpisah) ────────────────────
  # Build image backend+frontend SEKALI di CI, push ke GHCR. VPS tinggal
  # `docker compose pull` — tidak lagi mem-build di server produksi. Tag:
  #   latest          → deploy normal
  #   sha-<commit>    → artefak imutable per commit (untuk rollback:
  #                     IMAGE_TAG=sha-<commit> docker compose up -d)
  # Hanya push ke main, dan HANYA bila semua job uji hijau — image yang terbit
  # dijamin sudah lolos lint+test+e2e+backup+audit.
  docker-publish:
    name: Publish image (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend, frontend, e2e, backup-restore, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/populicenter/survei-backend:latest
            ghcr.io/populicenter/survei-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runner
          push: true
          # Samakan dengan build-arg di docker-compose.yml (API relatif /api).
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/populicenter/survei-frontend:latest
            ghcr.io/populicenter/survei-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
