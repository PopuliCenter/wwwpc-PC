name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Jalankan manual dari tab Actions. Diperlukan saat yang berubah bukan kode
  # melainkan konfigurasi build di GitHub (mis. variable VITE_GOOGLE_CLIENT_ID
  # yang di-bake ke image web) — tanpa ini, satu-satunya cara membangun ulang
  # image adalah membuat commit kosong.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Semua test backend pakai repository mock (tidak butuh Postgres/Redis/MinIO nyata).
      - name: Typecheck
        run: npx tsc --noEmit -p backend/tsconfig.json
      - name: Test (dengan gate coverage)
        run: npm run test:coverage --workspace=backend
      - name: Build
        run: npm run build --workspace=backend

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Test
        run: npm run test --workspace=frontend
      # `build` = `tsc -b && vite build` — typecheck & build sekaligus, gagal bila ada error tipe.
      - name: Typecheck + Build
        run: npm run build --workspace=frontend

  e2e:
    name: Backend E2E (smoke — DB+Redis nyata)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: survei_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d survei_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Skema DB dibangun lewat migrasi asli (prepareSchema); creds & port
      # service container cocok dgn default di backend/test/e2e-env.ts.
      - name: E2E smoke (login → isi survei → redeem)
        run: npm run test:e2e --workspace=backend

  backup-restore:
    name: Backup ↔ restore (roundtrip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres + MinIO ephemeral
        # Pull dulu dengan retry — penyebab paling umum kegagalan `up -d` di
        # runner adalah rate-limit pull Docker Hub yang bersifat sementara.
        # Retry berjenjang menutup itu; `up -d` lalu memakai image yang sudah ada.
        run: |
          pull_retry() {
            for n in 1 2 3 4 5; do
              docker pull "$1" && return 0
              echo "pull $1 gagal (percobaan $n) — tunggu $((n*10))s"; sleep $((n*10))
            done
            echo "GAGAL pull $1 setelah 5 percobaan"; return 1
          }
          pull_retry postgres:16-alpine
          pull_retry quay.io/minio/minio:latest
          docker compose -f docker-compose.backup-test.yml up -d
      - name: Tunggu container sehat
        run: |
          for i in $(seq 1 30); do
            pg=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose -f docker-compose.backup-test.yml ps -q postgres)" 2>/dev/null || true)
            mi=$(docker inspect --format '{{.State.Running}}' \
              "$(docker compose -f docker-compose.backup-test.yml ps -q minio)" 2>/dev/null || true)
            [ "$pg" = healthy ] && [ "$mi" = true ] && exit 0
            sleep 2
          done
          echo "container tidak siap"; exit 1
      - name: Uji roundtrip backup→restore
        run: bash scripts/test-backup-restore.sh
      - name: Bersihkan
        if: always()
        run: docker compose -f docker-compose.backup-test.yml down -v

  audit:
    name: Security audit (dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # GERBANG WAJIB: gagal bila ada high/critical PRODUKSI DI LUAR allowlist
      # ber-batas-waktu di scripts/audit-gate.mjs. Allowlist hanya memuat advisory
      # yang penutupannya butuh upgrade major @nestjs v10→v12 (proyek terpisah);
      # tiap entri punya alasan + tanggal kedaluwarsa. Menurunkan --audit-level
      # SENGAJA dihindari (itu membutakan gerbang thd high lain). moderate/low
      # tidak memblokir.
      - name: Audit production deps (gate + allowlist)
        run: node scripts/audit-gate.mjs

  # ── Rilis image (12-factor V: build-release-run terpisah) ────────────────────
  # Build image backend+frontend SEKALI di CI, push ke GHCR. VPS tinggal
  # `docker compose pull` — tidak lagi mem-build di server produksi. Tag:
  #   latest          → deploy normal
  #   sha-<commit>    → artefak imutable per commit (untuk rollback:
  #                     IMAGE_TAG=sha-<commit> docker compose up -d)
  # Hanya push ke main, dan HANYA bila semua job uji hijau — image yang terbit
  # dijamin sudah lolos lint+test+e2e+backup+audit.
  docker-publish:
    name: Publish image (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend, frontend, e2e, backup-restore, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Smoke test image backend YANG SEBENARNYA (Alpine/musl + versi Node image)
      # sebelum di-push. Job test lain jalan di Ubuntu/glibc via setup-node, jadi
      # modul native (bcrypt) & runtime image tidak pernah teruji di sana. Kalau
      # gagal di sini, `latest` tidak tersentuh. Build ini mengisi cache gha yang
      # langsung dipakai ulang oleh langkah push di bawah.
      - name: Build backend (lokal, untuk smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runner
          load: true
          tags: survei-backend:smoke
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Smoke test image backend (Node, bcrypt native, nodemailer)
        run: |
          docker run --rm --entrypoint node survei-backend:smoke -e "
            const major = Number(process.versions.node.split('.')[0]);
            if (major < 24) throw new Error('Node ' + process.versions.node + ' < 24');
            const bcrypt = require('bcrypt');
            const h = bcrypt.hashSync('uji-rahasia', 4);
            if (!bcrypt.compareSync('uji-rahasia', h)) throw new Error('bcrypt compare gagal');
            if (bcrypt.compareSync('salah', h)) throw new Error('bcrypt menerima password salah');
            const nm = require('nodemailer');
            if (typeof nm.createTransport !== 'function') throw new Error('nodemailer.createTransport hilang');
            console.log('OK — Node', process.versions.node, '| bcrypt native jalan | nodemailer siap');
          "
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/populicenter/survei-backend:latest
            ghcr.io/populicenter/survei-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runner
          push: true
          # Samakan dengan build-arg di docker-compose.yml (API relatif /api).
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/populicenter/survei-frontend:latest
            ghcr.io/populicenter/survei-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
