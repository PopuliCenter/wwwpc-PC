# =============================================================================
# docker/nginx/nginx.conf — Nginx reverse proxy untuk mode dev hybrid
#
# Digunakan saat: nginx berjalan di Docker tapi backend di HOST (npm run dev).
# Untuk PRODUCTION/full-Docker, gunakan frontend/nginx.conf yang sudah include
# proxy ke service "backend" dalam jaringan Docker internal.
# =============================================================================

upstream backend_api {
    # host.docker.internal → IP host dari dalam container Docker
    # Windows/Mac: langsung tersedia
    # Linux: tambahkan --add-host=host.docker.internal:host-gateway di compose
    server host.docker.internal:3000;
}

server {
    listen 80;
    server_name localhost;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── API Proxy → backend di host ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;
    }

    # ── Static assets ──────────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-XSS-Protection       "1; mode=block"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Tolak akses ke file tersembunyi
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
