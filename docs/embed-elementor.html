<!--
  EMBED SURVEI ONLINE UNTUK ELEMENTOR
  ===================================
  Cara pakai:
  1. Di Elementor, tambahkan widget "HTML" (Custom HTML) ke section yang diinginkan.
  2. Salin SELURUH isi file ini ke dalam widget tersebut.
  3. Section Elementor sebaiknya diset Full Width / Stretched, dan padding section = 0
     supaya iframe benar-benar full.

  Catatan:
  - ?embed=1 -> aplikasi menyembunyikan header/brand bawaannya (pakai header Elementor).
  - allow="geolocation" -> wajib agar fitur rekam lokasi GPS saat isi survei tetap jalan
    di dalam iframe (lokasi GPS dipakai untuk Peta Sebaran di dashboard admin).
  - Tinggi iframe menyesuaikan konten otomatis (auto-resize) lewat postMessage.

  PILIHAN src (ganti atribut src pada iframe sesuai kebutuhan):
  - Halaman masuk umum      : https://survei.risetcenter.com/login?embed=1
  - Halaman daftar akun     : https://survei.risetcenter.com/register?embed=1
  - LANGSUNG ke satu survei  : https://survei.risetcenter.com/surveys/<ID_SURVEI>/fill?embed=1
      Cocok untuk landing page kampanye spesifik. Ganti <ID_SURVEI> dengan id survei
      (lihat di URL admin saat membuka survei: /admin/surveys/<ID_SURVEI>/edit).
      Jika pengunjung belum login, mereka diarahkan ke halaman masuk dulu, lalu
      otomatis dikembalikan ke survei tersebut setelah berhasil masuk.
-->
<div style="width:100%;">
  <iframe
    id="survei-embed"
    src="https://survei.risetcenter.com/surveys/GANTI_ID_SURVEI/fill?embed=1"
    title="Survei Online"
    style="width:100%; border:0; display:block; min-height:640px;"
    loading="lazy"
    allow="geolocation"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<script>
  (function () {
    var frame = document.getElementById('survei-embed');
    if (!frame) return;
    window.addEventListener('message', function (e) {
      // Terima pesan tinggi HANYA dari domain aplikasi survei.
      if (e.origin !== 'https://survei.risetcenter.com') return;
      var data = e.data || {};
      if (data.type === 'survei-embed:height' && data.height) {
        frame.style.height = data.height + 'px';
      }
    });
  })();
</script>
